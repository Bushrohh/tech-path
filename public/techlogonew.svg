<!-- /src/assets/logo-techpath.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Tech Path logo</title>
  <desc id="logoDesc">A rounded emerald gradient circle with a white stylized path/circuit and Tech Path wordmark.</desc>

  <!-- background gradient circle -->
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"></stop>
      <stop offset="50%" stop-color="#10b981"></stop>
      <stop offset="100%" stop-color="#059669"></stop>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"></feDropShadow>
    </filter>
  </defs>

  <!-- circle with slight shadow -->
  <g filter="url(#s)">
    <circle cx="60" cy="40" r="32" fill="url(#g1)"></circle>
  </g>

  <!-- stylized path / circuit inside circle -->
  <g transform="translate(0,0)" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 45 C50 30, 70 30, 75 45"></path>
    <circle cx="45" cy="45" r="3.2" fill="#fff" stroke="none"></circle>
    <circle cx="75" cy="45" r="3.2" fill="#fff" stroke="none"></circle>
    <path d="M60 44 v18"></path>
    <circle cx="60" cy="64" r="3.2" fill="#fff" stroke="none"></circle>
  </g>

  <!-- wordmark -->
  <g transform="translate(12,86)">
    <text x="0" y="0" font-family="Inter, Roboto, system-ui, -apple-system, 'Segoe UI', Arial" font-weight="700" font-size="18" fill="#0f172a">Tech</text>
    <text x="52" y="0" font-family="Inter, Roboto, system-ui, -apple-system, 'Segoe UI', Arial" font-weight="600" font-size="18" fill="#065f46">Path</text>
  </g>
</svg>
